name: Daily Train and Predict

on:
  schedule:
    - cron: "55 23 * * 1-6"   # 01:00 UTC Mon-Fri (after data update at 22:00)
  workflow_dispatch:
    inputs:
      option:
        description: "Option to train (A, B, or both)"
        required: false
        default: "both"

jobs:
  # 1. Standard Training
  train-standard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements_train.txt
      
      - name: Train DeePM (evar + sharpe)
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          OPTION="${{ github.event.inputs.option || 'both' }}"
          python train.py --option $OPTION --loss both

      - name: Upload standard models artifact
        uses: actions/upload-artifact@v4
        with:
          name: standard-models
          path: |
            models/deepm_option*_best.pt
            models/scaler_option*.pkl
            models/meta_option*.json
          retention-days: 1

  # 2. Window Training (Matrix Parallelization)
  train-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        option: [A, B]
        window: [1, 2, 3, 4, 5, 6, 7, 8]
        loss: [evar, sharpe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements_train.txt

      - name: Train Single Window
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          REQUESTED_OPT="${{ github.event.inputs.option || 'both' }}"
          CURRENT_OPT="${{ matrix.option }}"
          
          if [ "$REQUESTED_OPT" != "both" ] && [ "$REQUESTED_OPT" != "$CURRENT_OPT" ]; then
            echo "Skipping Option $CURRENT_OPT because only $REQUESTED_OPT was requested."
            exit 0
          fi
          
          python train_windows.py --option $CURRENT_OPT --window ${{ matrix.window }} --loss ${{ matrix.loss }}

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: window-results-${{ matrix.option }}-w${{ matrix.window }}-${{ matrix.loss }}
          path: |
            models/*w${{ matrix.window }}_${{ matrix.loss }}*
            models/result_option*
          retention-days: 1

  # 3. Aggregate, Predict, and Upload
  aggregate-and-predict:
    needs: [train-standard, train-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements_train.txt

      - name: Download Standard Models
        uses: actions/download-artifact@v4
        with:
          name: standard-models
          path: models/

      - name: Download Window Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: window-results-*
          merge-multiple: true
          path: models/

      - name: Aggregate Window Results
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: |
          OPTION="${{ github.event.inputs.option || 'both' }}"
          python train_windows.py --aggregate --option $OPTION

      - name: Generate daily signals
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          FRED_API_KEY:    ${{ secrets.FRED_API_KEY }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python predict.py --option both

      - name: Upload models and signals to HuggingFace
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
        run: python data_upload_hf.py --models

      - name: Confirm completion
        run: echo "Training and signal generation complete."
